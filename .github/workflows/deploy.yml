name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Rebuild every 3 hours so renewable energy data stays fresh
    - cron: "0 */3 * * *"
  workflow_dispatch: # allow manual trigger from the Actions tab

# Grant the GITHUB_TOKEN the permissions needed by actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; don't cancel in-progress runs
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate static data
        # Fetches live renewable + carbon data → writes public/data/combined.json
        run: npx tsx scripts/generate-data.ts
        env:
          # Optional: add this secret in repo Settings → Secrets for live Electricity Maps data
          ELECTRICITY_MAPS_TOKEN: ${{ secrets.ELECTRICITY_MAPS_TOKEN }}

      - name: Build (static export)
        run: npx next build
        env:
          # Tells next.config.ts to set basePath and Dashboard where to fetch JSON
          BASE_PATH: /climate-action-leaderboard
          NEXT_PUBLIC_BASE_PATH: /climate-action-leaderboard

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
